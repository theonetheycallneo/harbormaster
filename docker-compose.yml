services:
  db:
    image: pgvector/pgvector:pg17
    container_name: harbormaster-db
    environment:
      POSTGRES_USER: harbormaster
      POSTGRES_PASSWORD: harbormaster
      POSTGRES_DB: harbormaster
    ports:
      - "5442:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - harbormaster-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbormaster"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  harbormaster-pgdata:
